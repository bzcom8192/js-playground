# Semicolon Acres Online: Apache vhost (same model as money-app):
#   public HTTPS name  ->  Apache  ->  http://127.0.0.1:4188 (farmer-server.service)
# The Node server answers both the game (static files) and /api on that port.
#
#   sudo a2enmod ssl proxy proxy_http headers
#   sudo cp server/deploy/apache-vhost.example.conf /etc/apache2/sites-available/js-farmer.conf
#   (edit ServerName and the certificate paths)
#   sudo a2ensite js-farmer && sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName farmer.example.com

    # Let's Encrypt (webroot mode) is answered here, the rest goes to HTTPS.
    DocumentRoot /var/www/html
    RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://farmer.example.com/$1"
</VirtualHost>

<VirtualHost *:443>
    ServerName farmer.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/farmer.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/farmer.example.com/privkey.pem

    # Reverse proxy only, never a forward proxy.
    ProxyRequests Off
    ProxyPreserveHost On

    # Standard proxy headers. Apache itself adds X-Forwarded-For, -Host and
    # -Server. A visitor's own X-Forwarded-For is dropped first: Apache would
    # otherwise append to it, and the server (with TRUST_PROXY=1) reads the
    # first address in the list.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"

    # Rate limiting: through a proxy every request reaches Node from 127.0.0.1.
    # That is fine for players: the limit (60 writes/min) is counted per player
    # token, not per address, so a shared IP is already handled. Only writes
    # without a valid token (register, unknown tokens) are counted per address,
    # all visitors together. If that is ever too tight, set TRUST_PROXY=1 in
    # farmer-server.service and they are counted per visitor address instead.

    # retry=0: no 60 s error pause after a service restart.
    # disablereuse: Node closes idle connections after 5 s, so don't pool them.
    # timeout: a queued replay can take a while (10 s limit each).
    ProxyPass        "/" "http://127.0.0.1:4188/" retry=0 disablereuse=on timeout=120
    ProxyPassReverse "/" "http://127.0.0.1:4188/"

    # The Node server does not compress; the editor bundle is a few MB.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/js-farmer-error.log
    CustomLog ${APACHE_LOG_DIR}/js-farmer-access.log combined
</VirtualHost>
